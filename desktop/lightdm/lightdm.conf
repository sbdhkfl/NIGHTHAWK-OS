# NIGHTHAWK OS - LightDM configuration
# Installed to /etc/lightdm/lightdm.conf in the image.

[Seat:*]
greeter-session=lightdm-gtk-greeter

[daemon]
# User sessions: start XFCE4
user-session=xfce

[security]
# Allow local console logins; no default accounts are shipped
allow-user-setup=yes

[policykit]
linux-defaults=true
