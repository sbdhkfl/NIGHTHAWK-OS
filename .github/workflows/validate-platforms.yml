name: Validate platform registry

on:
  push:
    paths:
      - "platforms/**"
      - "scripts/validate-platforms.py"
      - ".github/workflows/validate-platforms.yml"
  pull_request:
    paths:
      - "platforms/**"
      - "scripts/validate-platforms.py"
      - ".github/workflows/validate-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate target registry
        run: python scripts/validate-platforms.py
