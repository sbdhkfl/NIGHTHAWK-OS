# NIGHTHAWK OS - automatic first boot configuration
# Applied by the Armbian first boot preset mechanism (see docs).
# SECURITY: no default accounts or passwords are preset. The interactive
# first boot flow asks the user to create a local account.

PRESET_CONFIGURATION=""

PRESET_NET_CHANGE_DEFAULTS="0"
PRESET_NET_ETHERNET_ENABLED="0"
PRESET_NET_WIFI_ENABLED="0"
PRESET_NET_WIFI_SSID=""
PRESET_NET_WIFI_KEY=""
PRESET_NET_WIFI_COUNTRYCODE=""
PRESET_CONNECT_WIRELESS="n"
PRESET_NET_USE_STATIC="0"
PRESET_NET_STATIC_IP=""
PRESET_NET_STATIC_MASK=""
PRESET_NET_STATIC_GATEWAY=""
PRESET_NET_STATIC_DNS=""

SET_LANG_BASED_ON_LOCATION="n"
PRESET_LOCALE="en_US.UTF-8"
PRESET_TIMEZONE="Etc/UTC"

PRESET_ROOT_PASSWORD=""
PRESET_ROOT_KEY=""
PRESET_USER_NAME=""
PRESET_USER_PASSWORD=""
PRESET_USER_KEY=""
PRESET_DEFAULT_REALNAME=""
PRESET_USER_SHELL="bash"
